set-option -sa terminal-overrides ",xterm*:Tc"

# change escape delay ( better vim compatibility )
set -s escape-time 10

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on
set -g extended-keys on

set -g base-index 1
set -g pane-base-index 1

unbind C-b
set-option -g prefix C-a
bind C-a send-prefix
set-option -g prefix2 none

unbind R
bind -N "Reload tmux config" R source-file ~/.config/tmux/tmux.conf

unbind %
bind -N "Split pane horizontally" | split-window -h -c "#{pane_current_path}"

unbind '"'
bind -N "Split pane vertically" - split-window -v -c "#{pane_current_path}"

# resizing panes with hjkl
bind -N "Resize pane down" -r j resize-pane -D 5
bind -N "Resize pane up" -r k resize-pane -U 5
bind -N "Resize pane right" -r l resize-pane -R 5
bind -N "Resize pane left" -r h resize-pane -L 5

# maximize panes
bind -N "Toggle pane zoom" -r m resize-pane -Z

# window management
# Shift Alt vim keys to switch windows
bind -N "Previous window (No Prefix)" -n M-H previous-window
bind -N "Next window (No Prefix)" -n M-L next-window

# mouse support
set -g mouse on

# background terminal fix
set -g status-bg default
set -g status-style bg=default

# vim shell navigations and selects in tmux panes
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

bind-key -N "Create new named session" n command-prompt "new-session -s '%%'"

# Drag copy using mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Clipboard settings
unbind v
bind -N "Enter copy mode" v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Portable clipboard integration (WSL / native Linux)
# Detects environment at tmux start and binds the right clipboard tool.
#
# WSL: uses win32yank.exe (shared Windows clipboard)
# Linux Wayland: uses wl-copy / wl-paste
# Linux with xclip: uses xclip
# Linux with xsel: uses xsel
if-shell 'grep -qi microsoft /proc/version 2>/dev/null' {
    # WSL — use win32yank.exe
    bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
    bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
    bind -N "Paste from clipboard" p run "win32yank.exe -o --lf | tmux load-buffer - ; tmux paste-buffer"
    bind -N "Paste from clipboard" C-p run "win32yank.exe -o --lf | tmux load-buffer - ; tmux paste-buffer"
} {
    # Native Linux — try wl-copy (Wayland) first, then xclip, then xsel
    if-shell 'command -v wl-copy >/dev/null 2>&1' {
        bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "wl-copy"
        bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
        bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
        bind -N "Paste from clipboard" p run "wl-paste | tmux load-buffer - ; tmux paste-buffer"
        bind -N "Paste from clipboard" C-p run "wl-paste | tmux load-buffer - ; tmux paste-buffer"
    } {
        if-shell 'command -v xclip >/dev/null 2>&1' {
            bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
            bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
            bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
            bind -N "Paste from clipboard" p run "xclip -out -selection clipboard | tmux load-buffer - ; tmux paste-buffer"
            bind -N "Paste from clipboard" C-p run "xclip -out -selection clipboard | tmux load-buffer - ; tmux paste-buffer"
        } {
            if-shell 'command -v xsel >/dev/null 2>&1' {
                bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "xsel --clipboard --input"
                bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xsel --clipboard --input"
                bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xsel --clipboard --input"
                bind -N "Paste from clipboard" p run "xsel --clipboard --output | tmux load-buffer - ; tmux paste-buffer"
                bind -N "Paste from clipboard" C-p run "xsel --clipboard --output | tmux load-buffer - ; tmux paste-buffer"
            }
        }
    }
}

# Session management (t=tag, :=run cmd on tagged, e.g. kill-session)
bind -N "Session tree (t=tag :=cmd-tagged)" s choose-tree -Zs
bind -N "Switch to COAGENT" F1 switch-client -t '=COAGENT'
# Function-key fallback for keyboards/terminals that do not deliver F1.
bind -N "Switch to COAGENT (F1 fallback)" F5 switch-client -t '=COAGENT'
bind -N "Switch to SWARMER" F2 switch-client -t '=SWARMER'
bind -N "Switch to PhD" F3 switch-client -t '=PhD'
bind -N "Switch to misc" F4 switch-client -t '=misc'

# Help menu - show all annotated keybindings in fzf popup (vim-style navigation)
# j/k = move, g/G = first/last, / or i = search, Esc = cancel search or close, q = close
bind -N "Show keybinding help (fzf)" ? display-popup -E -w80% -h60% \
  "tmux list-keys -N | sed 's/^bind-key *//' | fzf --reverse --no-sort \
  --header='Keybindings  j/k:move  /:search  Esc:cancel  q:quit' \
  --disabled \
  --bind='j:down,k:up,g:first,G:last,ctrl-d:half-page-down,ctrl-u:half-page-up' \
  --bind='/:enable-search+clear-query,i:enable-search+clear-query' \
  --bind='esc:cancel,q:abort' \
  --bind='enter:accept'"

# tmux plugin manager
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin 'omerxx/tmux-sessionx'

# Continuum and popup are declared after the theme/status plugins below.

# Plugin settings - configure popup server to load bindings
set -g @popup-autostart on
set -g @popup-id-format "#{b:pane_current_path}/{popup_name}"

# CRITICAL: Make popup sessions load THIS config so bindings work inside
set -g @popup-on-init "source-file ~/.config/tmux/tmux.conf; set status off"

# Popup bindings - work in BOTH main session AND inside popups
bind -N "Toggle shell popup (No Prefix)" -n M-t run "#{@popup-toggle} -w75% -h75% -E -d '#{pane_current_path}' --name=shell"
bind -N "Toggle lazygit popup (No Prefix)" -n M-g run "#{@popup-toggle} -w90% -h90% -E -d '#{pane_current_path}' --name=lazygit lazygit"

bind -N "Create custom popup command" x command-prompt -p "--> %" "run-shell 'tmux kill-session -t popup:custom 2>/dev/null || true'; run-shell '#{@popup-toggle} -w85% -h85% -E -d \"#{pane_current_path}\" --name=custom %%'"
bind -N "Toggle custom popup" X run-shell '#{@popup-toggle} -w85% -h85% -E -d "#{pane_current_path}" --name=custom'

# Popup session manager - retain focus/kill behavior from the XDG config.
# Enter: re-opens the selected popup; ctrl-x: kills it with live reload.
bind -N "Manage popup sessions (fzf focus/kill)" P display-popup -E -w70% -h50% \
  "tmux -L popup list-panes -a \
    -F '#{session_name}  #{pane_current_command}  #{b:pane_current_path}  pid:#{pane_pid}' \
    2>/dev/null | \
  fzf --reverse --no-sort \
    --header='Popup Sessions  Enter:focus  ctrl-x:kill  Esc:cancel' \
    --bind='j:down,k:up,g:first,G:last,ctrl-d:half-page-down,ctrl-u:half-page-up' \
    --bind='esc:cancel,q:abort' \
    --bind='ctrl-x:execute-silent(sess=\$(echo {} | awk \"{print \\$1}\"); tmux -L popup kill-session -t \"\$sess\" 2>/dev/null)+reload(tmux -L popup list-panes -a -F \"#{session_name}  #{pane_current_command}  #{b:pane_current_path}  pid:#{pane_pid}\" 2>/dev/null)' \
    --preview='pid=\$(echo {} | grep -oP \"pid:\\K[0-9]+\"); pstree -p \$pid 2>/dev/null || ps --forest -o pid,cmd -g \$pid 2>/dev/null' \
    --preview-window=down:5:wrap | \
  awk '{print \$1}' > /tmp/tmux_popup_sel" \; \
  run-shell 'sess=$(cat /tmp/tmux_popup_sel 2>/dev/null); rm -f /tmp/tmux_popup_sel; [ -n "$sess" ] && tmux display-popup -w85% -h85% -E /bin/sh -c "exec tmux -L popup attach-session -t \"=$sess\""'

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin "christoomey/vim-tmux-navigator"

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

# Load Continuum after theme/status plugins, but before popup autostart.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'loichyan/tmux-toggle-popup'

set -g @sessionx-bind 'o'
set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-pane-contents-area "full"
set -g @continuum-boot "off"

# The startup helper below owns restoration, bypassing Continuum's multi-server
# guard. Zero disables Continuum's native startup detection (avoids two restores).
# @continuum-restore still controls automatic restoration in the helper.
set -g @continuum-restore-max-delay '0'

# Only the default server owns the four workspaces and their shared snapshot.
# Popup/other sockets must never restore or overwrite the main backup.
if-shell -F '#{m:*/default,#{socket_path}}' {
    set -g @resurrect-dir '~/.local/share/tmux/resurrect'
    set -g @workspace-save-interval '5'
    set -g @continuum-save-interval '5'
    set -g @continuum-restore 'on'
    # Keep saving paused until startup recovery is complete. The helper waits
    # for the initial session to exist, then restores once in the background.
    if-shell -F '#{!=:#{@workspace-startup-status},ready}' {
        set -g @continuum-save-interval '0'
    }
    run-shell -b '~/dotfiles/tmux/restore-on-start.sh'
} {
    set -gF @resurrect-dir '~/.local/share/tmux/resurrect-#{b:socket_path}'
    set -g @continuum-save-interval '0'
    set -g @continuum-restore 'off'
}

# Configure Catppuccin
set -g @catppuccin_flavour "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Border
set -g pane-border-style "fg=#{@thm_surface_0}"
set -g pane-active-border-style "fg=#{@thm_mauve}"

# Configure Online status
set -g @online_icon "ok"
set -g @offline_icon "nok"

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
# battery not working as of now, should fix for when using on a laptop
#set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=#{@thm_bg},fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
#set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg}]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red},bold]#[reverse] 󰖪 off }"

# Explicitly keep the save hook on the main server: Continuum's multi-server
# guard otherwise skips re-adding it on reload while the popup server exists.
# status-right is rebuilt above, so repeated reloads cannot duplicate this hook.
if-shell -F '#{m:*/default,#{socket_path}}' {
    set -ga status-right "#($HOME/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
}

# Configure Tmux
set -g status-position bottom
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"

# Force popup borders (mocha palette)
set -g pane-border-style "fg=#{@thm_surface_0}"
set -g pane-active-border-style "fg=#{@thm_mauve}"

run '~/.config/tmux/plugins/tpm/tpm' # always keep this line last
 
